name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Only what the tests import. torch and sentence-transformers are loaded lazily and only to embed,
      # so they are not installed here; the tests that need the database or a model skip themselves.
      - run: pip install "psycopg[binary]==3.3.6" pgvector==0.5.1 pytest==9.1.1
      - run: python -m pytest -q
